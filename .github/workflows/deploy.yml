name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ec2-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy
    environment: EC2_HOST
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Build frontend assets
      # ---------------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # ---------------------------------------------------------------
      # Prepare SSH
      # ---------------------------------------------------------------
      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ---------------------------------------------------------------
      # Sync application to EC2
      #
      # IMPORTANT:
      # Actual Laravel project path:
      # /var/www/coffeepos/cofeesystem2
      # ---------------------------------------------------------------
      - name: Sync files to server
        env:
          REMOTE_USER: ${{ secrets.EC2_USERNAME }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
        run: |
          rsync -azh --delete \
            -e "ssh -i $HOME/.ssh/ec2_key -o StrictHostKeyChecking=accept-new" \
            --exclude '.git*' \
            --exclude '.env*' \
            --exclude 'storage/' \
            --exclude 'bootstrap/cache/' \
            --exclude 'vendor/' \
            --exclude 'node_modules/' \
            --exclude 'tests/' \
            --exclude '.github/' \
            --exclude 'public/productImages/' \
            --exclude 'public/adminProfile/' \
            --exclude 'public/customerProfile/' \
            ./ \
            "$REMOTE_USER@$REMOTE_HOST:/var/www/coffeepos/cofeesystem2/"

      # ---------------------------------------------------------------
      # Laravel deployment steps on EC2
      # ---------------------------------------------------------------
      - name: Run Laravel deploy steps
        env:
          REMOTE_USER: ${{ secrets.EC2_USERNAME }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i "$HOME/.ssh/ec2_key" \
            -o StrictHostKeyChecking=accept-new \
            "$REMOTE_USER@$REMOTE_HOST" 'bash -s' <<'REMOTE'
          set -e

          cd /var/www/coffeepos/cofeesystem2

          # Ensure Laravel runtime directories exist.
          sudo mkdir -p storage/framework/cache
          sudo mkdir -p storage/framework/sessions
          sudo mkdir -p storage/framework/views
          sudo mkdir -p storage/logs
          sudo mkdir -p bootstrap/cache

          # ubuntu runs Artisan/composer.
          # www-data runs PHP-FPM.
          # Give both users the required access.
          sudo chown -R ubuntu:www-data storage bootstrap/cache
          sudo chmod -R ug+rwX storage bootstrap/cache

          # Put application into maintenance mode.
          php artisan down --retry=60 || true
          trap 'php artisan up || true' EXIT

          # Install/update PHP dependencies.
          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

          # Apply database changes.
          php artisan migrate --force

          # Clear old caches.
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

          # Rebuild caches.
          php artisan config:cache
          php artisan view:cache

          # route:cache is disabled because the application
          # currently has duplicate route names.

          # Ensure correct permissions remain after deployment.
          sudo chown -R ubuntu:www-data storage bootstrap/cache
          sudo chmod -R ug+rwX storage bootstrap/cache

          # Bring application back online.
          php artisan up

          # Reload PHP-FPM.
          sudo systemctl reload php8.3-fpm
          REMOTE
      # ---------------------------------------------------------------
      # Health check
      # ---------------------------------------------------------------
      # - name: Health check
      #   if: ${{ secrets.EC2_HEALTH_URL != '' }}
      #   env:
      #     HEALTH_URL: ${{ secrets.EC2_HEALTH_URL }}
      #   run: |
      #     curl -fsS -o /dev/null -w "HTTP %{http_code}\n" -m 30 "$HEALTH_URL"